spring.application.name=backend
server.port=${PORT:8080}
spring.profiles.default=supabase

spring.jpa.hibernate.ddl-auto=update

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXP_SECONDS:604800}

bidmart.services.mode=${BIDMART_SERVICES_MODE:local}
bidmart.services.user.base-url=${BIDMART_USER_SERVICE_BASE_URL:http://localhost:8081}
bidmart.services.listing.base-url=${BIDMART_LISTING_SERVICE_BASE_URL:http://localhost:8082}
bidmart.services.wallet.base-url=${BIDMART_WALLET_SERVICE_BASE_URL:http://localhost:8083}
